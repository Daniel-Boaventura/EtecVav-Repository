
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pizzaria do 67</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-dark bg-danger">

        <div class="container">

            <a class="navbar-brand" href="#">
                🍕 Pizzaria do 67
            </a>

            <div>

                <a class="text-white me-3" href="#inicio">
                    Início
                </a>

                <a class="text-white me-3" href="#pizzas">
                    Pizzas
                </a>

                <a class="text-white" href="#contato">
                    Contato
                </a>

            </div>

        </div>

    </nav>


    <section id="inicio" class="text-center p-5">

        <h1>BEM VINDO!!</h1>

        <p>
            As melhores pizzas do MUNDO
        </p>

        <button class="btn btn-danger">
            Fazer pedido
        </button>

    </section>


   
    <section id="pizzas" class="container">

        <h2 class="text-center mb-4">
            Conheça nossas pizzas
        </h2>


        <div class="row">

            <!-- PIZZA CALABRESA -->
            <div class="col-md-4">

                <div class="card">

                    <img src="calabresa.jfif"
                         class="card-img-top">

                    <div class="card-body">

                        <h5 class="card-title">
                            Calabresa
                        </h5>

                        <p>
                            R$ 40,00
                        </p>

                        <button class="btn btn-danger">
                            Pedir
                        </button>

                    </div>

                </div>

            </div>


            <!-- PIZZA FRANGO COM CATUPIRY -->
            <div class="col-md-4">

                <div class="card">

                    <img src="catupiry.jfif"
                         class="card-img-top">

                    <div class="card-body">

                        <h5 class="card-title">
                            Frango-Catupiry
                        </h5>

                        <p>
                            R$ 45,00
                        </p>

                        <button class="btn btn-danger">
                            Pedir
                        </button>

                    </div>

                </div>

            </div>


            <!-- PIZZA PEPERONI -->
            <div class="col-md-4">

                <div class="card">

                    <img src="peperoni.jpg"
                         class="card-img-top">

                    <div class="card-body">

                        <h5 class="card-title">
                            Peperoni
                        </h5>

                        <p>
                            R$ 42,00
                        </p>

                        <button class="btn btn-danger">
                            Pedir
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- CONTATO -->
    <section id="contato" class="text-center p-5">

        <h2>Contato</h2>

        <p>
            📞 (67) 12345-6767
        </p>

        <p>
            📍 Rua da aura, 67
        </p>

    </section>


    <!-- RODAPÉ -->
    <footer class="bg-danger text-white text-center p-3">

        Pizzaria do 67 - 2026 - Pablo Peterson e Daniel Mariz

    </footer>

</body>

</html>
